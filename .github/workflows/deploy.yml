name: Deploy E-Commerce Platform

on:
  push:
    branches: [main, "mr-*"]
  pull_request:
    types: [opened, synchronize, closed]

env:
  AWS_REGION: us-east-1
  TF_DIR: infrastructure/env

permissions:
  id-token: write
  contents: read

jobs:
  # ── Resolve env name and tfvars file from branch/PR context ─────────────────
  env-config:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      tfvars_file: ${{ steps.set.outputs.tfvars_file }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=dev"                              >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/dev.tfvars" >> $GITHUB_OUTPUT
          else
            MR_NUM="${{ github.event.pull_request.number }}"
            echo "env=mr-${MR_NUM}"                    >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/mr.tfvars"  >> $GITHUB_OUTPUT
          fi

  # ── Infrastructure: single terraform apply (no EKS wait needed with ECS) ────
  infra:
    needs: env-config
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Build Lambda authorizer package
        run: |
          ENV="${{ needs.env-config.outputs.env }}"
          BUILD_DIR="/tmp/anycompany-authorizer-build-${ENV}"
          ZIP_PATH="/tmp/anycompany-authorizer-${ENV}.zip"
          rm -rf "${BUILD_DIR}" && mkdir -p "${BUILD_DIR}"
          python3 -m pip install -q -r src/authorizer/requirements.txt -t "${BUILD_DIR}"
          cp src/authorizer/lambda_authorizer.py "${BUILD_DIR}/"
          cd "${BUILD_DIR}" && zip -qr "${ZIP_PATH}" .
          echo "Built ${ZIP_PATH} ($(du -sh ${ZIP_PATH} | cut -f1))"

      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
              -backend-config="key=${{ needs.env-config.outputs.env }}/terraform.tfstate" \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' \
              > ${{ env.TF_DIR }}/backend_local_override.tf
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure
          fi

      - name: Terraform Apply
        run: |
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=${{ needs.env-config.outputs.tfvars_file }} \
            -var="env=${{ needs.env-config.outputs.env }}" \
            -auto-approve

  # ── App: unit tests → ECR build/push → ECS rolling deploy ──────────────────
  app:
    needs: [env-config, infra]
    if: needs.infra.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install fastapi uvicorn boto3 "pydantic[email]" moto pytest httpx \
            "python-jose[cryptography]" cryptography

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          TABLE_NAME: test-users
          AWS_REGION: ${{ env.AWS_REGION }}
          COGNITO_CLIENT_ID: test-client
          COGNITO_USER_POOL_ID: us-east-1_test

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all service images
        id: build
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}"
          PREFIX="anycompany-users-${{ needs.env-config.outputs.env }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_BASE="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          # Services: "ecr-repo-name|src-dir"
          SERVICES=(
            "anycompany-login-service|src/login"
            "anycompany-users-service|src/users"
            "anycompany-browse-service|src/browse"
            "anycompany-search-service|src/search"
            "anycompany-payment-service|src/payment"
            "anycompany-shipping-service|src/shipping"
          )

          for svc in "${SERVICES[@]}"; do
            REPO="${svc%%|*}"
            DIR="${svc##*|}"

            ECR_URI=$(aws ecr describe-repositories \
              --repository-names "${REPO}" \
              --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")

            if [ -z "$ECR_URI" ]; then
              echo "ECR repo ${REPO} not found — skipping"
              continue
            fi

            # Skip if this SHA already pushed (idempotent on retries)
            if aws ecr describe-images --repository-name "${REPO}" \
                 --image-ids imageTag="${IMAGE_TAG}" &>/dev/null; then
              echo "${REPO}:${IMAGE_TAG} already in ECR — skipping build"
            else
              echo "Building ${REPO}:${IMAGE_TAG} from ${DIR}/"
              docker build -t "${ECR_URI}:${IMAGE_TAG}" "${DIR}/"
              docker push "${ECR_URI}:${IMAGE_TAG}"
            fi
          done

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Deploy all ECS services
        run: |
          IMAGE_TAG="${{ steps.build.outputs.image_tag }}"
          ENV="${{ needs.env-config.outputs.env }}"
          PREFIX="anycompany-users-${ENV}"
          CLUSTER="${PREFIX}-cluster"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_BASE="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          # Map: "ecs-service-name|container-name|ecr-repo"
          SERVICES=(
            "${PREFIX}-login-service|login-service|anycompany-login-service"
            "${PREFIX}-users-service|users-service|anycompany-users-service"
            "${PREFIX}-browse-service|browse-service|anycompany-browse-service"
            "${PREFIX}-search-service|search-service|anycompany-search-service"
            "${PREFIX}-payment-service|payment-service|anycompany-payment-service"
            "${PREFIX}-shipping-service|shipping-service|anycompany-shipping-service"
          )

          for svc in "${SERVICES[@]}"; do
            ECS_SVC="${svc%%|*}"; rest="${svc#*|}"
            CONTAINER="${rest%%|*}"
            REPO="${rest##*|}"
            NEW_IMAGE="${ECR_BASE}/${REPO}:${IMAGE_TAG}"

            echo "Updating ${ECS_SVC} → ${NEW_IMAGE}"

            # Get current task definition family
            TASK_FAMILY=$(aws ecs describe-services \
              --cluster "${CLUSTER}" --services "${ECS_SVC}" \
              --query 'services[0].taskDefinition' --output text | \
              sed 's|.*/||' | sed 's|:[0-9]*$||')

            # Fetch current task def and update image for the target container
            NEW_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "${TASK_FAMILY}" \
              --query 'taskDefinition' | \
              python3 -c "
import sys, json
td = json.load(sys.stdin)
for c in td['containerDefinitions']:
    if c['name'] == '${CONTAINER}':
        c['image'] = '${NEW_IMAGE}'
# Strip read-only fields before re-registering
for key in ['taskDefinitionArn','revision','status','requiresAttributes',
            'compatibilities','registeredAt','registeredBy']:
    td.pop(key, None)
print(json.dumps(td))")

            # Register new task definition revision
            NEW_ARN=$(echo "${NEW_TASK_DEF}" | \
              aws ecs register-task-definition \
                --cli-input-json file:///dev/stdin \
                --query 'taskDefinition.taskDefinitionArn' --output text)

            # Update the service
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${ECS_SVC}" \
              --task-definition "${NEW_ARN}" \
              --output text > /dev/null

            echo "  Registered ${NEW_ARN}"
          done

          # Wait for all services to reach steady state
          echo "Waiting for all services to stabilize..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services $(printf "${PREFIX}-%s " \
              login-service users-service browse-service \
              search-service payment-service shipping-service)

          echo "All ECS services deployed and stable."

  # ── Gate: check whether preprod credentials are configured ──────────────────
  check-preprod:
    needs: app
    if: github.ref == 'refs/heads/main' && needs.app.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.PREPROD_DEPLOY_ROLE_ARN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

  # ── Preprod promotion — manual gate, promotes same image built in dev ────────
  promote-preprod:
    needs: [app, check-preprod]
    if: needs.check-preprod.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preprod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Build Lambda authorizer package
        run: |
          BUILD_DIR="/tmp/anycompany-authorizer-build-preprod"
          ZIP_PATH="/tmp/anycompany-authorizer-preprod.zip"
          rm -rf "${BUILD_DIR}" && mkdir -p "${BUILD_DIR}"
          python3 -m pip install -q -r src/authorizer/requirements.txt -t "${BUILD_DIR}"
          cp src/authorizer/lambda_authorizer.py "${BUILD_DIR}/"
          cd "${BUILD_DIR}" && zip -qr "${ZIP_PATH}" .

      - name: Terraform Init (preprod)
        run: |
          terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
            -backend-config="key=preprod/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.PREPROD_TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (preprod)
        run: |
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=environments/preprod.tfvars \
            -var="env=preprod" \
            -auto-approve

      - name: Deploy to preprod — same image tag, no rebuild
        run: |
          IMAGE_TAG="${{ needs.app.outputs.image_tag }}"
          PREFIX="anycompany-users-preprod"
          CLUSTER="${PREFIX}-cluster"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_BASE="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          SERVICES=(
            "${PREFIX}-login-service|login-service|anycompany-login-service"
            "${PREFIX}-users-service|users-service|anycompany-users-service"
            "${PREFIX}-browse-service|browse-service|anycompany-browse-service"
            "${PREFIX}-search-service|search-service|anycompany-search-service"
            "${PREFIX}-payment-service|payment-service|anycompany-payment-service"
            "${PREFIX}-shipping-service|shipping-service|anycompany-shipping-service"
          )

          for svc in "${SERVICES[@]}"; do
            ECS_SVC="${svc%%|*}"; rest="${svc#*|}"
            CONTAINER="${rest%%|*}"; REPO="${rest##*|}"
            NEW_IMAGE="${ECR_BASE}/${REPO}:${IMAGE_TAG}"

            TASK_FAMILY=$(aws ecs describe-services \
              --cluster "${CLUSTER}" --services "${ECS_SVC}" \
              --query 'services[0].taskDefinition' --output text | \
              sed 's|.*/||' | sed 's|:[0-9]*$||')

            NEW_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "${TASK_FAMILY}" --query 'taskDefinition' | \
              python3 -c "
import sys, json
td = json.load(sys.stdin)
for c in td['containerDefinitions']:
    if c['name'] == '${CONTAINER}':
        c['image'] = '${NEW_IMAGE}'
for key in ['taskDefinitionArn','revision','status','requiresAttributes',
            'compatibilities','registeredAt','registeredBy']:
    td.pop(key, None)
print(json.dumps(td))")

            NEW_ARN=$(echo "${NEW_TASK_DEF}" | \
              aws ecs register-task-definition \
                --cli-input-json file:///dev/stdin \
                --query 'taskDefinition.taskDefinitionArn' --output text)

            aws ecs update-service \
              --cluster "${CLUSTER}" --service "${ECS_SVC}" \
              --task-definition "${NEW_ARN}" --output text > /dev/null
          done

          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services $(printf "${PREFIX}-%s " \
              login-service users-service browse-service \
              search-service payment-service shipping-service)

  # ── Gate: check whether prod credentials are configured ─────────────────────
  check-prod:
    needs: promote-preprod
    if: needs.promote-preprod.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.PROD_DEPLOY_ROLE_ARN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

  # ── Prod promotion — manual gate, promotes same image from preprod ───────────
  promote-prod:
    needs: [app, check-prod]
    if: needs.check-prod.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Build Lambda authorizer package
        run: |
          BUILD_DIR="/tmp/anycompany-authorizer-build-prod"
          ZIP_PATH="/tmp/anycompany-authorizer-prod.zip"
          rm -rf "${BUILD_DIR}" && mkdir -p "${BUILD_DIR}"
          python3 -m pip install -q -r src/authorizer/requirements.txt -t "${BUILD_DIR}"
          cp src/authorizer/lambda_authorizer.py "${BUILD_DIR}/"
          cd "${BUILD_DIR}" && zip -qr "${ZIP_PATH}" .

      - name: Terraform Init (prod)
        run: |
          terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.PROD_TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (prod)
        run: |
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=environments/prod.tfvars \
            -var="env=prod" \
            -auto-approve

      - name: Deploy to prod — same image tag, no rebuild
        run: |
          IMAGE_TAG="${{ needs.app.outputs.image_tag }}"
          PREFIX="anycompany-users-prod"
          CLUSTER="${PREFIX}-cluster"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_BASE="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          SERVICES=(
            "${PREFIX}-login-service|login-service|anycompany-login-service"
            "${PREFIX}-users-service|users-service|anycompany-users-service"
            "${PREFIX}-browse-service|browse-service|anycompany-browse-service"
            "${PREFIX}-search-service|search-service|anycompany-search-service"
            "${PREFIX}-payment-service|payment-service|anycompany-payment-service"
            "${PREFIX}-shipping-service|shipping-service|anycompany-shipping-service"
          )

          for svc in "${SERVICES[@]}"; do
            ECS_SVC="${svc%%|*}"; rest="${svc#*|}"
            CONTAINER="${rest%%|*}"; REPO="${rest##*|}"
            NEW_IMAGE="${ECR_BASE}/${REPO}:${IMAGE_TAG}"

            TASK_FAMILY=$(aws ecs describe-services \
              --cluster "${CLUSTER}" --services "${ECS_SVC}" \
              --query 'services[0].taskDefinition' --output text | \
              sed 's|.*/||' | sed 's|:[0-9]*$||')

            NEW_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "${TASK_FAMILY}" --query 'taskDefinition' | \
              python3 -c "
import sys, json
td = json.load(sys.stdin)
for c in td['containerDefinitions']:
    if c['name'] == '${CONTAINER}':
        c['image'] = '${NEW_IMAGE}'
for key in ['taskDefinitionArn','revision','status','requiresAttributes',
            'compatibilities','registeredAt','registeredBy']:
    td.pop(key, None)
print(json.dumps(td))")

            NEW_ARN=$(echo "${NEW_TASK_DEF}" | \
              aws ecs register-task-definition \
                --cli-input-json file:///dev/stdin \
                --query 'taskDefinition.taskDefinitionArn' --output text)

            aws ecs update-service \
              --cluster "${CLUSTER}" --service "${ECS_SVC}" \
              --task-definition "${NEW_ARN}" --output text > /dev/null
          done

          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services $(printf "${PREFIX}-%s " \
              login-service users-service browse-service \
              search-service payment-service shipping-service)

  # ── Teardown ephemeral MR environment when PR is closed ─────────────────────
  teardown-mr:
    needs: env-config
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
              -backend-config="key=${{ needs.env-config.outputs.env }}/terraform.tfstate" \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' \
              > ${{ env.TF_DIR }}/backend_local_override.tf
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure
          fi

      - name: Terraform Destroy (MR env)
        run: |
          terraform -chdir=${{ env.TF_DIR }} destroy \
            -var-file=environments/mr.tfvars \
            -var="env=${{ needs.env-config.outputs.env }}" \
            -auto-approve

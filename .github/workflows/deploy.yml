name: Deploy Users Service

on:
  push:
    branches: [main, "mr-*"]
  pull_request:
    types: [opened, synchronize, closed]

env:
  AWS_REGION: us-east-1
  TF_DIR: infrastructure/env

permissions:
  id-token: write
  contents: read

jobs:
  # ── Resolve env name and tfvars file from branch/PR context ───────────────
  env-config:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      tfvars_file: ${{ steps.set.outputs.tfvars_file }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=dev"                              >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/dev.tfvars" >> $GITHUB_OUTPUT
          else
            MR_NUM="${{ github.event.pull_request.number }}"
            echo "env=mr-${MR_NUM}"                    >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/mr.tfvars"  >> $GITHUB_OUTPUT
          fi

  # ── Infrastructure: VPC → EKS → NLB → VPC Link → API Gateway → K8s infra ─
  infra:
    needs: env-config
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      eks_cluster_name: anycompany-users-${{ needs.env-config.outputs.env }}-cluster
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
              -backend-config="key=${{ needs.env-config.outputs.env }}/terraform.tfstate" \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' \
              > ${{ env.TF_DIR }}/backend_local_override.tf
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure
          fi

      # Phase 1 — EKS cluster + IAM roles
      # Pass endpoint from AWS if cluster already exists so kubernetes provider
      # doesn't fall back to localhost. K8s resources are not targeted here.
      - name: Phase 1 — EKS cluster
        run: |
          EKS_CLUSTER="anycompany-users-${{ needs.env-config.outputs.env }}-cluster"
          EKS_ENDPOINT=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.endpoint' --output text 2>/dev/null || echo "")
          EKS_CA=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.certificateAuthority.data' --output text 2>/dev/null || echo "")
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=${{ needs.env-config.outputs.tfvars_file }} \
            -var="env=${{ needs.env-config.outputs.env }}" \
            -var="eks_cluster_endpoint=${EKS_ENDPOINT}" \
            -var="eks_cluster_ca_cert=${EKS_CA}" \
            -target=aws_iam_role.eks_cluster \
            -target=aws_iam_role.eks_nodes \
            -target=aws_iam_role_policy_attachment.eks_cluster_policy \
            -target=aws_iam_role_policy_attachment.eks_worker_node \
            -target=aws_iam_role_policy_attachment.eks_cni \
            -target=aws_iam_role_policy_attachment.eks_ecr_read \
            -target=aws_eks_cluster.main \
            -target=aws_eks_node_group.main \
            -target=aws_iam_openid_connect_provider.eks \
            -auto-approve

      # Phase 2 — wait for EKS to be ACTIVE, then apply all AWS + K8s resources
      # By this point EKS exists and has a real endpoint — kubernetes provider
      # can connect and create namespace, service accounts, config map.
      - name: Phase 2 — wait for EKS active
        run: |
          EKS_CLUSTER="anycompany-users-${{ needs.env-config.outputs.env }}-cluster"
          echo "Waiting for EKS cluster to become ACTIVE..."
          aws eks wait cluster-active --name "${EKS_CLUSTER}" --region ${{ env.AWS_REGION }}

      - name: Phase 2 — NLB, API Gateway, K8s infra
        run: |
          EKS_CLUSTER="anycompany-users-${{ needs.env-config.outputs.env }}-cluster"
          EKS_ENDPOINT=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.endpoint' --output text)
          EKS_CA=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.certificateAuthority.data' --output text)
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=${{ needs.env-config.outputs.tfvars_file }} \
            -var="env=${{ needs.env-config.outputs.env }}" \
            -var="eks_cluster_endpoint=${EKS_ENDPOINT}" \
            -var="eks_cluster_ca_cert=${EKS_CA}" \
            -auto-approve

  # ── App: unit tests → ECR build/push → EKS rolling deploy ─────────────────
  # Only runs when infra succeeds — never on infra failure.
  app:
    needs: [env-config, infra]
    if: needs.infra.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install fastapi uvicorn boto3 "pydantic[email]" moto pytest httpx "python-jose[cryptography]" cryptography

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          TABLE_NAME: test-users
          AWS_REGION: ${{ env.AWS_REGION }}
          COGNITO_CLIENT_ID: test-client
          COGNITO_USER_POOL_ID: us-east-1_test

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images to ECR
        id: images
        run: |
          SHA="${{ github.sha }}"
          ENV="${{ needs.env-config.outputs.env }}"
          LOGIN_ECR=$(aws ecr describe-repositories \
            --repository-names anycompany-login-service \
            --query 'repositories[0].repositoryUri' --output text)
          USERS_ECR=$(aws ecr describe-repositories \
            --repository-names anycompany-users-service \
            --query 'repositories[0].repositoryUri' --output text)

          LOGIN_TAG="${LOGIN_ECR}:${ENV}-${SHA:0:8}"
          USERS_TAG="${USERS_ECR}:${ENV}-${SHA:0:8}"

          docker build -t "${LOGIN_TAG}" src/login/
          docker push "${LOGIN_TAG}"
          docker build -t "${USERS_TAG}" src/users/
          docker push "${USERS_TAG}"

          echo "login_tag=${LOGIN_TAG}" >> $GITHUB_OUTPUT
          echo "users_tag=${USERS_TAG}" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.infra.outputs.eks_cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply K8s manifests and roll out
        run: |
          NS="anycompany-users-${{ needs.env-config.outputs.env }}"
          LOGIN_TAG="${{ steps.images.outputs.login_tag }}"
          USERS_TAG="${{ steps.images.outputs.users_tag }}"

          sed "s|IMAGE_TAG|${LOGIN_TAG}|g" k8s/login-deployment.yaml | kubectl apply -n "${NS}" -f -
          sed "s|IMAGE_TAG|${USERS_TAG}|g" k8s/users-deployment.yaml | kubectl apply -n "${NS}" -f -
          kubectl apply -n "${NS}" -f k8s/login-service.yaml
          kubectl apply -n "${NS}" -f k8s/users-service.yaml

          kubectl rollout status deployment/login-service -n "${NS}" --timeout=5m
          kubectl rollout status deployment/users-service -n "${NS}" --timeout=5m

  # ── Preprod promotion (manual gate, main branch only) ─────────────────────
  promote-preprod:
    needs: app
    if: github.ref == 'refs/heads/main' && needs.app.result == 'success' && secrets.PREPROD_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: preprod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init (preprod)
        run: |
          terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
            -backend-config="key=preprod/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.PREPROD_TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (preprod)
        run: |
          EKS_CLUSTER="anycompany-users-preprod-cluster"
          EKS_ENDPOINT=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.endpoint' --output text 2>/dev/null || echo "")
          EKS_CA=$(aws eks describe-cluster --name "${EKS_CLUSTER}" \
            --query 'cluster.certificateAuthority.data' --output text 2>/dev/null || echo "")
          terraform -chdir=${{ env.TF_DIR }} apply \
            -var-file=environments/preprod.tfvars \
            -var="env=preprod" \
            -var="eks_cluster_endpoint=${EKS_ENDPOINT}" \
            -var="eks_cluster_ca_cert=${EKS_CA}" \
            -auto-approve

      - name: Configure kubectl (preprod)
        run: aws eks update-kubeconfig --name anycompany-users-preprod-cluster --region ${{ env.AWS_REGION }}

      - name: Promote images and deploy to preprod
        run: |
          SHA="${{ github.sha }}"
          LOGIN_ECR=$(aws ecr describe-repositories --repository-names anycompany-login-service \
            --query 'repositories[0].repositoryUri' --output text)
          USERS_ECR=$(aws ecr describe-repositories --repository-names anycompany-users-service \
            --query 'repositories[0].repositoryUri' --output text)

          docker pull "${LOGIN_ECR}:dev-${SHA:0:8}"
          docker tag  "${LOGIN_ECR}:dev-${SHA:0:8}" "${LOGIN_ECR}:preprod-${SHA:0:8}"
          docker push "${LOGIN_ECR}:preprod-${SHA:0:8}"

          docker pull "${USERS_ECR}:dev-${SHA:0:8}"
          docker tag  "${USERS_ECR}:dev-${SHA:0:8}" "${USERS_ECR}:preprod-${SHA:0:8}"
          docker push "${USERS_ECR}:preprod-${SHA:0:8}"

          sed "s|IMAGE_TAG|${LOGIN_ECR}:preprod-${SHA:0:8}|g" k8s/login-deployment.yaml \
            | kubectl apply -n anycompany-users-preprod -f -
          sed "s|IMAGE_TAG|${USERS_ECR}:preprod-${SHA:0:8}|g" k8s/users-deployment.yaml \
            | kubectl apply -n anycompany-users-preprod -f -
          kubectl rollout status deployment/login-service -n anycompany-users-preprod --timeout=5m
          kubectl rollout status deployment/users-service -n anycompany-users-preprod --timeout=5m

  # ── Teardown ephemeral MR environment when PR is closed ───────────────────
  teardown-mr:
    needs: env-config
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure \
              -backend-config="key=${{ needs.env-config.outputs.env }}/terraform.tfstate" \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' \
              > ${{ env.TF_DIR }}/backend_local_override.tf
            terraform -chdir=${{ env.TF_DIR }} init -reconfigure
          fi

      - name: Terraform Destroy (MR env)
        run: |
          terraform -chdir=${{ env.TF_DIR }} destroy \
            -var-file=environments/mr.tfvars \
            -var="env=${{ needs.env-config.outputs.env }}" \
            -auto-approve

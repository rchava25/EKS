---
# ADOT Collector — sidecar mode.
# Each pod gets a collector sidecar that receives OTLP traces/metrics
# and forwards them to AWS X-Ray and CloudWatch.
# Deploy this after the ADOT EKS addon is active (adot.tf).
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: adot-sidecar
spec:
  mode: sidecar
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 50
      resource:
        attributes:
        - key: cloud.provider
          value: aws
          action: upsert

    exporters:
      awsxray:
        region: AWS_REGION
      awscloudwatch:
        region: AWS_REGION
        namespace: anycompany/users
        log_group_name: /aws/eks/anycompany-users/metrics

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [awsxray]
        metrics:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [awscloudwatch]

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: login-service-scaledobject
spec:
  scaleTargetRef:
    name: login-service
  minReplicaCount: 2
  maxReplicaCount: 5
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"

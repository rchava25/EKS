---
# Enforce CPU and memory limits on all pods.
# Without limits, a single misbehaving pod can starve the node.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-container-limits
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, keda, kyverno, external-secrets, opentelemetry-operator-system]
    validate:
      message: "CPU and memory limits are required on all containers."
      pattern:
        spec:
          containers:
          - resources:
              limits:
                cpu: "?*"
                memory: "?*"

---
# Block containers running as root (UID 0).
# Least-privilege: containers should run as non-root by default.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-runasnonroot
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, keda, kyverno, external-secrets, opentelemetry-operator-system]
    validate:
      message: "Containers must not run as root. Set securityContext.runAsNonRoot=true."
      pattern:
        spec:
          containers:
          - =(securityContext):
              =(runAsNonRoot): true

---
# Require standard labels on all pods for observability and cost attribution.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-app-label
    match:
      any:
      - resources:
          kinds: [Pod]
    validate:
      message: "Pods must have 'app' and 'version' labels."
      pattern:
        metadata:
          labels:
            app: "?*"
            version: "?*"

---
# Block privileged containers — equivalent to root on the host node.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-privileged
    match:
      any:
      - resources:
          kinds: [Pod]
    validate:
      message: "Privileged containers are not allowed."
      pattern:
        spec:
          containers:
          - =(securityContext):
              =(privileged): false

---
# Require readiness probes so pods are only routed traffic when truly ready.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readiness-probe
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-readiness-probe
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, keda, kyverno, external-secrets, opentelemetry-operator-system]
    validate:
      message: "Containers must define a readinessProbe."
      pattern:
        spec:
          containers:
          - readinessProbe:
              (httpGet | tcpSocket | exec): "?*"

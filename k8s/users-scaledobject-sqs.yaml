---
# TriggerAuthentication — binds KEDA to the keda-operator Pod Identity role.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-trigger-auth
  namespace: keda
spec:
  podIdentity:
    provider: aws

---
# SQS-based ScaledObject for users-service.
# Scales based on queue depth rather than CPU — proactive, not reactive.
# Scale-to-zero when queue is empty (idle cost = 0 pod overhead).
# Replace the CPU ScaledObject with this when async processing is the primary load pattern.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: users-service-sqs-scaledobject
spec:
  scaleTargetRef:
    name: users-service
  minReplicaCount: 0          # scale to zero when queue empty
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: keda-aws-trigger-auth
      kind: TriggerAuthentication
    metadata:
      queueURL: SQS_QUEUE_URL
      queueLength: "5"          # scale up 1 replica per 5 messages
      awsRegion: AWS_REGION

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: users-service-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-service
  updatePolicy:
    updateMode: "Off"   # recommendation only — no automatic restarts
  resourcePolicy:
    containerPolicies:
    - containerName: users-service
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: "2"
        memory: 512Mi
      controlledResources: ["cpu", "memory"]
